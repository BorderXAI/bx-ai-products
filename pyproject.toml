[tool.poetry]
name = "bx-ai-products"
version = "0.1.0"
description = "BorderX AI Products"
authors = ["BorderXAI <info@borderxai.com>"]

[tool.poetry.dependencies]
python = ">=3.11"
fastapi = ">=0.68.0"
uvicorn = ">=0.15.0"
aiohttp = ">=3.8.0"
python-dotenv = ">=0.19.0"
pydantic = ">=1.8.0"
apify-client = ">=1.8.0"
typing-extensions = ">=4.8.0"

[tool.poetry.dev-dependencies]
pytest = "7.4.3"
pytest-asyncio = "0.21.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api" 
